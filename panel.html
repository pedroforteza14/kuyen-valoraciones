<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Kuyen · Panel</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍩</text></svg>">

<body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const C = window.KUYEN;
const sb = (C.SUPABASE_URL && C.SUPABASE_ANON_KEY) ? supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY) : null;
const $=(h)=>{const t=document.createElement("template");t.innerHTML=h.trim();return t.content.firstElementChild;};
const app=document.getElementById("app");
const fmtWhen=(iso)=>{const d=new Date(iso);return d.toLocaleDateString("es-AR")+" · "+d.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});};
const clean=(s)=>String(s||"").replace(/[^\d]/g,"");
function normAR(raw){ let d=String(raw==null?"":raw).replace(/[^\d]/g,""); if(!d) return ""; if(d.startsWith("549")) return d; if(d.startsWith("54")) return "549"+d.slice(2); return "549"+d.replace(/^0/,""); }
const esc=(s)=>String(s==null?"":s).replace(/[<>&"']/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;","'":"&#39;"}[c]));
// Supabase devuelve como máximo 1000 filas por consulta: pide de a páginas hasta traer todo.
async function fetchAll(query){
  const out=[];
  for(let from=0;;from+=1000){
    const { data, error } = await query().range(from, from+999);
    if(error) return { data:null, error };
    out.push(...data);
    if(data.length<1000) return { data:out, error:null };
  }
}

const LEAF=`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 4C10 4 4 10 4 20c0 0 6-1 10-5 3-3 5-7 6-11ZM7 17c1-4 4-7 8-9"/></svg>`;
const waLogo=`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.2-1.7-.9-2-1-.3-.1-.5-.1-.7.2s-.7 1-.9 1.2c-.2.2-.3.2-.6.1-1.7-.8-2.8-1.5-3.9-3.4-.3-.5.3-.5.8-1.5.1-.2 0-.4 0-.5-.1-.1-.7-1.6-.9-2.2-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.2.2 2.1 3.3 5.2 4.6 2 .8 2.7.9 3.7.8.6-.1 1.7-.7 2-1.4.2-.7.2-1.2.2-1.4-.1-.1-.3-.2-.6-.3ZM12 2a10 10 0 0 0-8.6 15l-1.3 4.7 4.8-1.3A10 10 0 1 0 12 2Z"/></svg>`;

let cfg={ local_id:null, slug:"agronomia", nombre:"", google_review_url:C.GOOGLE_REVIEW_URL, whatsapp_template:C.WHATSAPP_TEMPLATE };
let historial=[], negativas=[], valoraciones=[], channel=null, audioCtx=null, filtro="todas", panelActive=false, refreshBound=false, cliRefresh=null, cliReload=null;

function brand(){ return $(`<div class="brand"><img class="logo" src="img/logo.png" alt="Kuyén"></div>`); }
function setLive(on){ const l=document.getElementById("live"), t=document.getElementById("liveTxt"); if(!l) return; l.classList.toggle("on",on); if(t) t.textContent=on?"En vivo":"Reconectando…"; }
// Refresca los datos al volver a la pestaña o recuperar internet; si expiró la sesión, vuelve al login.
async function refreshOnFocus(){
  if(!panelActive || !sb) return;
  const ae=document.activeElement; if(ae && /INPUT|TEXTAREA/.test(ae.tagName)) return; // no interrumpir mientras escribe
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ renderLogin(); return; }
  try{ await loadData(); }catch(e){}
  if(cliReload) cliReload(); // la lista de clientes la comparte todo el equipo
}
function bindRefresh(){
  if(refreshBound) return; refreshBound=true;
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") refreshOnFocus(); });
  window.addEventListener("online",refreshOnFocus);
}
function beep(){ try{ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==="suspended") audioCtx.resume(); const o=audioCtx.createOscillator(),g=audioCtx.createGain(); o.connect(g);g.connect(audioCtx.destination); o.type="sine";o.frequency.value=680;g.gain.value=0.08;o.start(); o.frequency.setValueAtTime(880,audioCtx.currentTime+0.12); setTimeout(()=>o.stop(),300);}catch(e){} }

/* ---------------- ARRANQUE ---------------- */
async function boot(){
  if(!sb){ app.innerHTML=""; app.appendChild(brand()); app.appendChild($(`<div class="card center"><h2>Falta configurar Supabase</h2><p class="lead">Completá SUPABASE_URL y SUPABASE_ANON_KEY en <b>config.js</b>.</p></div>`)); return; }
  bindRefresh();
  const { data:{ session } } = await sb.auth.getSession();
  session ? renderPanel(session) : renderLogin();
}

/* ---------------- LOGIN ---------------- */
function renderLogin(){
  panelActive=false; document.title="Kuyen · Panel"; setLive(false);
  if(channel){ sb.removeChannel(channel); channel=null; }
  app.innerHTML=""; app.className="wrap"; app.appendChild(brand());
  const card=$(`<div class="card fade">
    <span class="badge">Panel del local</span>
    <h2>Iniciá sesión</h2>
    <p class="lead">Solo para el equipo de Kuyen.</p>
    <div class="field"><label for="email">Usuario (email)</label><input id="email" type="email" autocomplete="username" placeholder="admin@kuyen.com" /></div>
    <div class="field"><label for="pass">Contraseña</label><input id="pass" type="password" autocomplete="current-password" placeholder="••••••••" /></div>
    <button class="btn btn-primary" id="in">Entrar</button>
    <p class="error" id="err"></p>
  </div>`);
  app.appendChild(card);
  const email=card.querySelector("#email"), pass=card.querySelector("#pass"), btn=card.querySelector("#in"), err=card.querySelector("#err");
  async function submit(){
    err.textContent=""; btn.disabled=true; btn.textContent="Entrando...";
    try{ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
    const { data, error } = await sb.auth.signInWithPassword({ email:email.value.trim(), password:pass.value });
    if(error){ err.textContent="Usuario o contraseña incorrectos."; btn.disabled=false; btn.textContent="Entrar"; return; }
    renderPanel(data.session);
  }
  btn.addEventListener("click",submit);
  pass.addEventListener("keydown",e=>{ if(e.key==="Enter") submit(); });
}

/* ---------------- PANEL ---------------- */
async function renderPanel(session){
  panelActive=true;
  app.innerHTML=""; app.className="wrap wide"; app.appendChild(brand());
  app.appendChild($(`<div class="topbar"><span class="who">🏠 <b id="localName">…</b> · 👤 ${esc(session.user.email)}</span><span class="topbar-right"><span class="live" id="live" title="Conexión en tiempo real"><span class="dot"></span><span id="liveTxt">Conectando…</span></span><button class="linkbtn" id="out">Cerrar sesión</button></span></div>`));
  app.appendChild($(`<div id="loadErr" class="loadbar hidden"></div>`));
  if("Notification" in window && Notification.permission==="default"){ Notification.requestPermission(); }

  const ratingUrl = () => location.origin + "/?local=" + (cfg.slug || "agronomia");

  // MÉTRICAS
  const mcard=$(`<div class="card"><div class="sec-title">Resumen del mes</div><div class="metrics" id="metrics"></div><p class="note" id="metricsHist" style="text-align:left"></p></div>`);
  // PEDIR VALORACIÓN
  const sendCard=$(`<div class="card">
    <span class="badge">Pedir valoración</span>
    <h2>Mandar por WhatsApp</h2>
    <div class="field">
      <label for="tel">Celular del cliente (con código de país)</label>
      <input id="tel" type="tel" inputmode="tel" placeholder="Ej: 5491122334455" autocomplete="off" />
      <p class="already" id="dupe"></p>
    </div>
    <div class="field"><label>Vista previa del mensaje</label><div class="msg-preview" id="prev"></div></div>
    <button class="btn btn-wa" id="waBtn">${waLogo}<span>Enviar por WhatsApp</span></button>
    <p class="note">Se abre WhatsApp con el mensaje listo. Vos tocás enviar. ✋</p>
  </div>`);
  // NEGATIVAS
  const negCard=$(`<div class="card">
    <div class="sec-title">Reseñas negativas <span class="count" id="ncount">0</span></div>
    <div class="filters" id="filters">
      <button class="chipbtn" data-f="todas">Todas</button>
      <button class="chipbtn" data-f="pendientes">Pendientes</button>
      <button class="chipbtn" data-f="resueltas">Resueltas</button>
    </div>
    <div class="list" id="nlist"><p class="empty">Cargando...</p></div>
  </div>`);
  // HISTORIAL
  const histCard=$(`<div class="card">
    <div class="sec-title">Historial de envíos <span class="count" id="hcount">0</span></div>
    <div class="list" id="hlist"><p class="empty">Cargando...</p></div>
    <button class="btn btn-ghost" id="hcopy" style="margin-top:14px">Copiar historial</button>
  </div>`);
  // PRINCIPALES PROBLEMAS (análisis de las negativas)
  const probCard=$(`<div class="card">
    <div class="sec-title">Principales problemas <span class="count" id="probCount">0</span></div>
    <div class="list" id="probList" style="max-height:none"><p class="empty">Cargando...</p></div>
  </div>`);
  // VALORACIONES POSITIVAS (quién puntuó 4-5★ desde un envío)
  const posCard=$(`<div class="card">
    <div class="sec-title">Valoraciones positivas <span class="count" id="posCount">0</span></div>
    <div class="list" id="posList"><p class="empty">Cargando...</p></div>
  </div>`);
  // CONFIGURACIÓN
  const cfgCard=$(`<div class="card">
    <div class="sec-title">Configuración</div>
    <div class="field"><label for="gurl">Link de reseñas de Google</label><input id="gurl" type="url" placeholder="https://g.page/r/.../review" /></div>
    <div class="field"><label for="wtpl">Mensaje de WhatsApp <span style="font-weight:400;color:var(--ink-soft)">(usá {link} donde va el link)</span></label><textarea id="wtpl" rows="5"></textarea></div>
    <button class="btn btn-primary" id="cfgSave">Guardar cambios</button>
    <p class="note" id="cfgMsg"></p>
  </div>`);
  // LISTA DE CLIENTES (Excel/CSV)
  const listaCard=$(`<div class="card">
    <span class="badge">Lista de clientes</span>
    <h2>Enviar desde tu Excel</h2>
    <p class="lead">Subí tu archivo (.xlsx o .csv) y mandá a cada cliente con un clic.</p>
    <label class="btn btn-ghost" style="cursor:pointer"><input type="file" id="fileInput" accept=".xlsx,.xls,.csv" style="display:none"><span>📄 Subir archivo</span></label>
    <p class="note" id="fileMsg" style="text-align:left"></p>
    <div id="listaWrap" class="hidden">
      <p class="note" id="listaFecha" style="text-align:left;margin:8px 0 0;color:var(--leaf-deep)"></p>
      <div class="field" style="margin:10px 0"><input id="buscarCli" type="text" placeholder="Buscar por nombre o número..." autocomplete="off" /></div>
      <div class="sec-title">Contactos <span class="count" id="cliCount">0</span></div>
      <div class="list" id="cliList"></div>
      <button class="btn btn-ghost mini" id="cliClear" style="margin-top:12px">Quitar lista</button>
    </div>
  </div>`);

  const grid=$(`<div class="panel-grid"></div>`);
  const colL=$(`<div class="col"></div>`);
  const colR=$(`<div class="col"></div>`);
  colL.appendChild(sendCard); colL.appendChild(listaCard); colL.appendChild(negCard);
  colR.appendChild(mcard); colR.appendChild(probCard); colR.appendChild(histCard); colR.appendChild(posCard); colR.appendChild(cfgCard);
  grid.appendChild(colL); grid.appendChild(colR);
  app.appendChild(grid);
  app.appendChild($(`<p class="foot">Link del cliente de este local: <a id="clientLink" href="#" target="_blank" rel="noopener"></a></p>`));

  document.getElementById("out").addEventListener("click",async()=>{ await sb.auth.signOut(); renderLogin(); });

  // filtros
  negCard.querySelectorAll(".chipbtn").forEach(b=>b.addEventListener("click",()=>{ filtro=b.dataset.f; renderNeg(); }));

  // envío WhatsApp
  const tel=sendCard.querySelector("#tel"), dupe=sendCard.querySelector("#dupe");
  function buildMsg(){ return (cfg.whatsapp_template||C.WHATSAPP_TEMPLATE).replace("{link}", ratingUrl()); }
  function refreshPrev(){ sendCard.querySelector("#prev").textContent = buildMsg(); }
  async function sendTo(n, nombre){
    const eid = crypto.randomUUID();
    const link = ratingUrl() + "&e=" + eid; // etiqueta para saber quién valora
    const enc=encodeURIComponent((cfg.whatsapp_template||C.WHATSAPP_TEMPLATE).replace("{link}", link));
    const isMobile=/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
    // En celu: abre la app de WhatsApp. En compu: abre WhatsApp Web directo (sale del número logueado ahí).
    const url = isMobile ? `https://wa.me/${n}?text=${enc}` : `https://web.whatsapp.com/send?phone=${n}&text=${enc}`;
    window.open(url,"_blank","noopener");
    const { data } = await sb.from("envios").insert({ id:eid, telefono:n, local_id:cfg.local_id, nombre:nombre||null }).select();
    if(data){ historial.unshift(data[0]); renderHist(); renderMetrics(); renderCli(); renderPositivas(); }
  }
  tel.addEventListener("input",()=>{
    const n=normAR(tel.value);
    const prev=n?historial.filter(r=>normAR(r.telefono)===n):[];
    tel.style.borderColor="";
    dupe.textContent=(clean(tel.value).length>=8 && prev.length) ? `⚠️ Ya contactaste este número (${fmtWhen(prev[0].creado_at)})` : "";
  });
  const waBtn=sendCard.querySelector("#waBtn");
  waBtn.addEventListener("click",async()=>{
    const n=normAR(tel.value);
    if(n.length<12){ tel.focus(); tel.style.borderColor="var(--danger)"; dupe.textContent="⚠️ Poné el celular completo con código de área (ej: 11 2233 4455)."; return; }
    waBtn.disabled=true;
    await sendTo(n); tel.value=""; dupe.textContent=""; tel.style.borderColor="";
    waBtn.disabled=false;
  });

  // Lista de clientes (Excel/CSV) — guardada en la base, la ve todo el equipo del local
  let contactos=[], listaFecha=null;
  const listaKey=()=>"kuyen_lista_"+(cfg.slug||"def"); // donde vivía antes la lista (solo en este navegador)
  const fileInput=listaCard.querySelector("#fileInput"), fileMsg=listaCard.querySelector("#fileMsg"), listaWrap=listaCard.querySelector("#listaWrap"), cliList=listaCard.querySelector("#cliList"), buscarCli=listaCard.querySelector("#buscarCli");
  // Guarda contactos {nombre, tel} sin duplicar teléfonos. Si un contacto viene sin nombre, no pisa el que ya estaba.
  async function saveContactos(lista){
    const porTel=new Map(); lista.forEach(c=>{ const prev=porTel.get(c.tel); porTel.set(c.tel,{ tel:c.tel, nombre:c.nombre||(prev&&prev.nombre)||"" }); });
    const ahora=new Date().toISOString();
    const fila=c=>({ local_id:cfg.local_id, telefono:c.tel, nombre:c.nombre||null, actualizado_at:ahora });
    const conNombre=[...porTel.values()].filter(c=>c.nombre).map(fila), sinNombre=[...porTel.values()].filter(c=>!c.nombre).map(fila);
    for(let i=0;i<conNombre.length;i+=500){ const { error } = await sb.from("clientes").upsert(conNombre.slice(i,i+500),{ onConflict:"local_id,telefono" }); if(error) return error; }
    for(let i=0;i<sinNombre.length;i+=500){ const { error } = await sb.from("clientes").upsert(sinNombre.slice(i,i+500),{ onConflict:"local_id,telefono", ignoreDuplicates:true }); if(error) return error; }
    return null;
  }
  async function loadLista(){
    // Si este navegador tenía una lista guardada de antes, la sube a la base una sola vez.
    let vieja=[]; try{ vieja=JSON.parse(localStorage.getItem(listaKey())||"[]"); }catch(e){}
    if(vieja.length && !(await saveContactos(vieja))){ localStorage.removeItem(listaKey()); localStorage.removeItem(listaKey()+"_fecha"); }
    const { data, error } = await fetchAll(()=>sb.from("clientes").select("nombre,telefono,actualizado_at").eq("local_id",cfg.local_id).order("nombre").order("telefono"));
    if(error){ fileMsg.textContent="⚠️ No se pudo cargar la lista de clientes."; return; }
    contactos=data.map(r=>({ nombre:r.nombre||"", tel:clean(r.telefono) })).filter(c=>c.tel); // la base es compartida: solo dígitos
    listaFecha=data.reduce((m,r)=>!m||r.actualizado_at>m?r.actualizado_at:m,null);
    renderCli();
  }
  function renderCli(){
    if(!contactos.length){ listaWrap.classList.add("hidden"); return; }
    listaWrap.classList.remove("hidden");
    const fe=document.getElementById("listaFecha"); if(fe) fe.textContent = listaFecha ? "📅 Última planilla subida: "+fmtWhen(listaFecha) : "";
    const enviados=new Set(historial.map(h=>clean(h.telefono)));
    const q=(buscarCli.value||"").toLowerCase(), qd=q.replace(/[^\d]/g,"");
    const data=contactos.filter(c=> !q || (c.nombre||"").toLowerCase().includes(q) || (qd && c.tel.includes(qd)));
    listaCard.querySelector("#cliCount").textContent = `${data.length} · ${contactos.filter(c=>enviados.has(c.tel)).length} enviados`;
    cliList.innerHTML="";
    data.slice(0,400).forEach(c=>{
      const row=$(`<div class="row"><span class="num" style="font-weight:600;font-family:var(--font-body)">${esc(c.nombre||c.tel)}<br><span style="font-size:12px;color:var(--ink-soft);font-weight:400">+${esc(c.tel)}</span></span></div>`);
      if(enviados.has(c.tel)){ row.appendChild($(`<span class="chip ok">Enviado ✓</span>`)); }
      else { const b=$(`<button class="btn btn-wa mini" style="width:auto">Enviar</button>`); b.addEventListener("click",async()=>{ b.disabled=true; await sendTo(c.tel, c.nombre); }); row.appendChild(b); }
      cliList.appendChild(row);
    });
  }
  cliRefresh=renderCli; cliReload=loadLista;
  fileInput.addEventListener("change",async(e)=>{
    const f=e.target.files[0]; if(!f) return;
    fileMsg.textContent="Leyendo archivo...";
    try{
      let wb;
      if(/\.csv$/i.test(f.name)){ // los CSV pueden venir en UTF-8 o en el formato viejo de Excel: así no se rompen los acentos
        const buf=await f.arrayBuffer(); let txt;
        try{ txt=new TextDecoder("utf-8",{fatal:true}).decode(buf); }catch(e){ txt=new TextDecoder("windows-1252").decode(buf); }
        wb=XLSX.read(txt.replace(/^﻿/,""),{type:"string"});
      } else wb=XLSX.read(await f.arrayBuffer());
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});
      const norm=s=>String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
      const keys=Object.keys(rows[0]||{});
      const telKey=keys.find(k=>/tel|cel|whats|phone/.test(norm(k)));
      const nameKey=keys.find(k=>/nombre|cliente|name/.test(norm(k)));
      if(!telKey){ fileMsg.textContent="⚠️ No encontré una columna de teléfono (tiene que tener un encabezado tipo 'Teléfono')."; return; }
      const nuevos = rows.map(r=>({ nombre:String(r[nameKey]||"").trim(), tel:normAR(r[telKey]) })).filter(c=>c.tel.length>=10);
      if(!nuevos.length){ fileMsg.textContent="⚠️ No encontré teléfonos válidos en el archivo."; return; }
      const yaEstaban=new Set(contactos.map(c=>c.tel)), sumados=new Set(nuevos.filter(c=>!yaEstaban.has(c.tel)).map(c=>c.tel)).size;
      fileMsg.textContent="Guardando...";
      if(await saveContactos(nuevos)){ fileMsg.textContent="⚠️ No se pudo guardar la lista. Probá de nuevo."; return; }
      fileInput.value="";
      await loadLista();
      fileMsg.textContent = `✓ ${new Set(nuevos.map(c=>c.tel)).size} contactos en el archivo · ${sumados} nuevos.`;
    }catch(err){ fileMsg.textContent="⚠️ No se pudo leer el archivo. ¿Es un .xlsx o .csv válido?"; }
  });
  buscarCli.addEventListener("input",renderCli);
  listaCard.querySelector("#cliClear").addEventListener("click",async(e)=>{
    if(!confirm("¿Borrar toda la lista de clientes de este local? Se borra para todo el equipo.")) return;
    e.target.disabled=true;
    const { error } = await sb.from("clientes").delete().eq("local_id",cfg.local_id);
    e.target.disabled=false;
    if(error){ alert("No se pudo borrar la lista."); return; }
    contactos=[]; listaFecha=null; fileMsg.textContent=""; fileInput.value=""; renderCli();
  });

  // copiar historial
  histCard.querySelector("#hcopy").addEventListener("click",async(e)=>{
    if(!historial.length){ e.target.textContent="Nada que copiar"; setTimeout(()=>e.target.textContent="Copiar historial",1600); return; }
    const text="Número\tFecha y hora\n"+historial.map(r=>`${r.telefono}\t${fmtWhen(r.creado_at)}`).join("\n");
    try{ await navigator.clipboard.writeText(text); e.target.textContent="¡Copiado! ✓"; }catch{ prompt("Copiá:",text); }
    setTimeout(()=>e.target.textContent="Copiar historial",1600);
  });

  // guardar config
  cfgCard.querySelector("#cfgSave").addEventListener("click",async(e)=>{
    const gurl=cfgCard.querySelector("#gurl").value.trim();
    const wtpl=cfgCard.querySelector("#wtpl").value;
    const msg=cfgCard.querySelector("#cfgMsg");
    e.target.disabled=true; e.target.textContent="Guardando...";
    const { error } = await sb.from("locales").update({ google_review_url:gurl, whatsapp_template:wtpl }).eq("id",cfg.local_id);
    e.target.disabled=false; e.target.textContent="Guardar cambios";
    if(error){ msg.textContent="No se pudo guardar."; return; }
    cfg.google_review_url=gurl; cfg.whatsapp_template=wtpl; refreshPrev();
    msg.textContent="¡Guardado! ✓ (aplica para todo el equipo)"; setTimeout(()=>msg.textContent="",2500);
  });

  await loadData();
  const ln=document.getElementById("localName"); if(ln) ln.textContent=cfg.nombre||"Local";
  const cl=document.getElementById("clientLink"); if(cl){ cl.href=ratingUrl(); cl.textContent=ratingUrl(); }
  cfgCard.querySelector("#gurl").value = cfg.google_review_url||"";
  cfgCard.querySelector("#wtpl").value = cfg.whatsapp_template||C.WHATSAPP_TEMPLATE;
  refreshPrev();
  loadLista();
  subscribeRealtime();
}

async function loadData(){
  const prof = await sb.from("perfiles").select("local_id").maybeSingle();
  const lid = prof.data ? prof.data.local_id : null;
  const valQuery = (cols) => fetchAll(()=>sb.from("valoraciones").select(cols).order("creado_at",{ascending:false}).order("id"));
  const [lc,h,n,v0] = await Promise.all([
    lid ? sb.from("locales").select("*").eq("id",lid).single() : Promise.resolve({data:null}),
    fetchAll(()=>sb.from("envios").select("*").order("creado_at",{ascending:false}).order("id")),
    fetchAll(()=>sb.from("resenas_negativas").select("*").order("creado_at",{ascending:false}).order("id")),
    valQuery("id,estrellas,creado_at,local_id,envio_id,visita,fue_a_google"),
  ]);
  const v = v0.error ? await valQuery("id,estrellas,creado_at,local_id,envio_id") : v0; // por si todavía no se corrió el parche SQL
  if(lc.data) cfg={ local_id:lc.data.id, slug:lc.data.slug, nombre:lc.data.nombre, google_review_url:lc.data.google_review_url||C.GOOGLE_REVIEW_URL, whatsapp_template:lc.data.whatsapp_template||C.WHATSAPP_TEMPLATE };
  historial=h.data||[]; negativas=n.data||[]; valoraciones=v.data||[];
  const lb=document.getElementById("loadErr");
  if(lb){
    const failed = !!(h.error||n.error||v.error);
    if(failed){
      lb.innerHTML=""; lb.appendChild($(`<span>⚠️ No se pudo cargar todo. Revisá tu conexión.</span>`));
      const rb=$(`<button class="btn btn-ghost mini" style="width:auto;margin:0">Reintentar</button>`);
      rb.addEventListener("click",()=>{ rb.disabled=true; loadData(); });
      lb.appendChild(rb); lb.classList.remove("hidden");
    } else lb.classList.add("hidden");
  }
  renderMetrics(); renderHist(); renderNeg(); renderPositivas(); renderProblemas();
}

function renderProblemas(){
  const box=document.getElementById("probList"); if(!box) return;
  const cats=[
    {emoji:"🥶", label:"Llegó frío", kw:["frio","fria","frios","helado","tibio"]},
    {emoji:"⏱️", label:"Demora / tardó", kw:["demora","tardo","tarde","lento","espere","esperar","esperando","nunca lleg","mucho tiempo"]},
    {emoji:"📦", label:"Faltó / incompleto", kw:["falto","faltaba","faltan","incompleto","no vino","no lleg","no trajo","equivocado","otro producto"]},
    {emoji:"😕", label:"Atención / trato", kw:["atencion","atendi","maltrato","grosero","respuesta","respondi","mala onda","trato","descortes"]},
    {emoji:"🍩", label:"Cantidad / porción", kw:["poco","poca","pocos","chico","chica","cantidad","porcion","escaso"]},
    {emoji:"😖", label:"Sabor / calidad", kw:["sabor","gusto","feo","seco","duro","quemado","salado","calidad","mal estado","rancio","viejo","crudo"]},
    {emoji:"💵", label:"Precio", kw:["caro","carisimo","precio","cobraron","cobro"]},
    {emoji:"🛵", label:"Entrega / delivery", kw:["direccion","domicilio","repartidor","delivery","reparto","cadete","paqueteria"]},
  ];
  const norm=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
  const counts=cats.map(c=>({...c,n:0})); let otros=0;
  negativas.forEach(r=>{
    const t=norm(r.comentario); let matched=false;
    counts.forEach(c=>{ if(c.kw.some(k=>t.includes(k))){ c.n++; matched=true; } });
    if(!matched && t.trim()) otros++;
  });
  const ranked=counts.filter(c=>c.n>0).sort((a,b)=>b.n-a.n);
  const cc=document.getElementById("probCount"); if(cc) cc.textContent=negativas.length;
  if(!ranked.length && !otros){ box.innerHTML=`<p class="empty">Sin negativas para analizar todavía. 🌟</p>`; return; }
  const max=Math.max(1,...ranked.map(c=>c.n));
  box.innerHTML="";
  ranked.forEach(c=>{
    box.appendChild($(`<div class="prob-row"><div class="prob-head"><span>${c.emoji} ${c.label}</span><b>${c.n}</b></div><div class="prob-bar"><div class="prob-fill" style="width:${Math.round(c.n/max*100)}%"></div></div></div>`));
  });
  if(otros){ box.appendChild($(`<div class="prob-row"><div class="prob-head"><span>🗂️ Otros</span><b>${otros}</b></div></div>`)); }
}

// Una fila por persona que valoró. Cada "visita" a la página puede tener varias filas
// (cambió de estrella o tocó Google): vale la última estrella y si fue a Google alguna vez.
// Las negativas viejas (de antes de guardar todas las estrellas) se suman desde su tabla.
function ratingsUnicas(){
  const porVisita=new Map(), sueltas=[];
  [...valoraciones].sort((a,b)=>new Date(a.creado_at)-new Date(b.creado_at)).forEach(v=>{
    if(!v.visita){ sueltas.push(v); return; }
    const prev=porVisita.get(v.visita);
    porVisita.set(v.visita,{ ...v, fue_a_google: !!(v.fue_a_google || (prev && prev.fue_a_google)) });
  });
  const negSueltas=negativas.filter(r=>!r.visita || !porVisita.has(r.visita))
    .map(r=>({ estrellas:r.estrellas, creado_at:r.creado_at, envio_id:r.envio_id, fue_a_google:false }));
  return [...porVisita.values(), ...sueltas, ...negSueltas];
}

function renderPositivas(){
  const box=document.getElementById("posList"); if(!box) return;
  const byId={}; historial.forEach(e=>byId[e.id]=e);
  const pos=ratingsUnicas().filter(v=>(v.estrellas||0)>=4 && v.envio_id && byId[v.envio_id])
    .sort((a,b)=>new Date(b.creado_at)-new Date(a.creado_at))
    .map(v=>({e:byId[v.envio_id], estrellas:v.estrellas, at:v.creado_at}));
  const cc=document.getElementById("posCount"); if(cc) cc.textContent=pos.length;
  if(!pos.length){ box.innerHTML=`<p class="empty">Todavía nadie valoró positivo desde un envío con nombre.</p>`; return; }
  box.innerHTML="";
  pos.forEach(p=>{
    const stars="★".repeat(p.estrellas||0);
    box.appendChild($(`<div class="row"><span class="num" style="font-weight:600;font-family:var(--font-body)">${esc(p.e.nombre||p.e.telefono)}<br><span style="font-size:12px;color:var(--ink-soft);font-weight:400">+${esc(p.e.telefono)} · <span style="color:var(--gold)">${stars}</span></span></span><span class="when">${fmtWhen(p.at)}</span></div>`));
  });
}

function renderMetrics(){
  const box=document.getElementById("metrics"); if(!box) return;
  const now=new Date(), mStart=new Date(now.getFullYear(),now.getMonth(),1);
  const delMes=r=>new Date(r.creado_at)>=mStart;
  const resumen=(lista)=>{
    const n=lista.length, pos=lista.filter(r=>(r.estrellas||0)>=4).length;
    return { n, prom: n ? lista.reduce((a,r)=>a+(r.estrellas||0),0)/n : 0, pct: n ? Math.round(pos/n*100) : 0, google: lista.filter(r=>r.fue_a_google).length };
  };
  const todas=ratingsUnicas(), mes=resumen(todas.filter(delMes)), hist=resumen(todas);
  const enviosMes=historial.filter(delMes).length;
  const pend = negativas.filter(r=>!r.resuelto).length;
  const tile=(n,l,warn)=>`<div class="tile${warn?' warn-tile':''}"><div class="n">${n}</div><div class="l">${l}</div></div>`;
  box.innerHTML =
    tile(enviosMes,"Pedidos enviados") +
    tile(mes.n,"Valoraciones") +
    tile(mes.n?mes.prom.toFixed(1)+"★":"—","Promedio") +
    tile(mes.n?mes.pct+"%":"—","Positivas (4-5★)") +
    tile(mes.google,"Fueron a Google") +
    tile(pend, pend?"Negativas pendientes":"Negativas al día", pend>0);
  const h=document.getElementById("metricsHist");
  if(h) h.textContent = hist.n ? `Histórico: ${hist.n} valoraciones · ${hist.prom.toFixed(1)}★ promedio · ${hist.pct}% positivas` : "";
}

function renderHist(){
  const list=document.getElementById("hlist"); if(!list) return;
  document.getElementById("hcount").textContent=historial.length;
  if(!historial.length){ list.innerHTML=`<p class="empty">Todavía no mandaste ninguna valoración.</p>`; return; }
  list.innerHTML="";
  historial.forEach(r=>{
    const row=$(`<div class="row"><span class="num">${esc(r.telefono)}</span><span class="row-right"><span class="when">${fmtWhen(r.creado_at)}</span><button class="hdel" title="Borrar envío">✕</button></span></div>`);
    row.querySelector(".hdel").addEventListener("click",async(e)=>{
      if(!confirm("¿Borrar este envío del historial? (útil para limpiar pruebas)")) return;
      e.target.disabled=true;
      const { data, error } = await sb.from("envios").delete().eq("id",r.id).select();
      if(!error && data && data.length){ historial=historial.filter(x=>x.id!==r.id); renderHist(); renderMetrics(); renderPositivas(); if(cliRefresh) cliRefresh(); }
      else if(!error){ e.target.disabled=false; alert("Falta activar el permiso para borrar envíos. Corré el SQL que te pasé en Supabase y probá de nuevo."); }
      else { e.target.disabled=false; alert("No se pudo borrar el envío."); }
    });
    list.appendChild(row);
  });
}

function renderNeg(){
  const list=document.getElementById("nlist"); if(!list) return;
  const pend=negativas.filter(r=>!r.resuelto).length;
  document.getElementById("ncount").textContent=pend;
  document.title = pend>0 ? `(${pend}) Kuyen · Panel` : "Kuyen · Panel";
  document.querySelectorAll("#filters .chipbtn").forEach(b=>b.classList.toggle("active",b.dataset.f===filtro));
  const byId={}; historial.forEach(e=>byId[e.id]=e);
  let data=negativas;
  if(filtro==="pendientes") data=negativas.filter(r=>!r.resuelto);
  if(filtro==="resueltas") data=negativas.filter(r=>r.resuelto);
  if(!data.length){ list.innerHTML=`<p class="empty">${negativas.length?"No hay reseñas en este filtro.":"Sin reseñas negativas. ¡Buena señal! 🌿"}</p>`; return; }
  list.innerHTML="";
  data.forEach(r=>{
    const stars="★".repeat(r.estrellas||0)+"☆".repeat(Math.max(0,5-(r.estrellas||0)));
    const c = (r.envio_id && byId[r.envio_id]) ? byId[r.envio_id] : null;
    const contactHtml = c
      ? `<div class="neg-contact">👤 ${esc(c.nombre||"Cliente")} · <b>+${esc(c.telefono)}</b></div>`
      : `<div class="neg-contact" style="opacity:.65">👤 Sin datos de contacto (reseña anónima)</div>`;
    const card=$(`<div class="neg ${r.resuelto?"done":""}">
      <div class="neg-head"><span class="neg-stars">${stars}</span><span class="neg-when">${fmtWhen(r.creado_at)}</span></div>
      <div class="neg-body">${esc(r.comentario)}</div>
      ${contactHtml}
      <div class="neg-nota-row">
        <input class="neg-nota" placeholder="Nota interna (opcional)..." value="${esc(r.nota)}" />
        <button class="btn btn-ghost mini nsave">Nota</button>
      </div>
      <div class="neg-actions"></div>
    </div>`);
    const notaInput=card.querySelector(".neg-nota");
    card.querySelector(".nsave").addEventListener("click",async(e)=>{
      e.target.disabled=true; const val=notaInput.value.trim();
      const { error } = await sb.from("resenas_negativas").update({ nota:val||null }).eq("id",r.id);
      e.target.disabled=false;
      if(!error){ r.nota=val; e.target.textContent="✓"; setTimeout(()=>e.target.textContent="Nota",1400); }
    });
    const actions=card.querySelector(".neg-actions");
    if(r.resuelto){
      actions.innerHTML=`<span class="chip ok">Resuelta ✓</span> <button class="btn btn-ghost mini reopen">Reabrir</button>`;
      actions.querySelector(".reopen").addEventListener("click",async(e)=>{ e.target.disabled=true; const {error}=await sb.from("resenas_negativas").update({resuelto:false}).eq("id",r.id); if(!error){ r.resuelto=false; renderNeg(); renderMetrics(); } });
    }else{
      actions.innerHTML=`<span class="chip pend" style="margin-right:10px">Pendiente</span>`;
      const btn=$(`<button class="btn btn-ghost mini">Marcar como resuelta</button>`);
      btn.addEventListener("click",async()=>{ btn.disabled=true; const {error}=await sb.from("resenas_negativas").update({resuelto:true}).eq("id",r.id); if(!error){ r.resuelto=true; renderNeg(); renderMetrics(); } else btn.disabled=false; });
      actions.appendChild(btn);
    }
    if(c){
      const wa=$(`<button class="btn btn-wa mini" style="width:auto">💬 Contactar</button>`);
      wa.addEventListener("click",()=>{
        const first=(c.nombre||"").trim().split(/\s+/)[0];
        const msg=encodeURIComponent(`¡Hola${first?" "+first:""}! 🧡 Te escribimos desde ${cfg.nombre||"Kuyén"}. Vimos tu comentario y de verdad queremos pedirte disculpas. Nos encantaría que nos cuentes qué pasó y compensarte. 🙏`);
        const isMobile=/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
        const url=isMobile?`https://wa.me/${c.telefono}?text=${msg}`:`https://web.whatsapp.com/send?phone=${c.telefono}&text=${msg}`;
        window.open(url,"_blank","noopener");
      });
      actions.appendChild(wa);
    }
    const del=$(`<button class="btn btn-ghost mini del">Eliminar</button>`);
    del.addEventListener("click",async()=>{
      if(!confirm("¿Eliminar esta reseña? No se puede deshacer.")) return;
      del.disabled=true;
      const {error}=await sb.from("resenas_negativas").delete().eq("id",r.id);
      if(!error && r.visita){ // también saca su estrella del promedio (útil para limpiar pruebas)
        const vd = await sb.from("valoraciones").delete().eq("visita",r.visita);
        if(!vd.error) valoraciones=valoraciones.filter(v=>v.visita!==r.visita);
      }
      if(!error){ negativas=negativas.filter(x=>x.id!==r.id); renderNeg(); renderMetrics(); renderProblemas(); renderPositivas(); }
      else { del.disabled=false; alert("No se pudo eliminar."); }
    });
    actions.appendChild(del);
    list.appendChild(card);
  });
}

function subscribeRealtime(){
  if(channel){ sb.removeChannel(channel); }
  channel = sb.channel("kuyen-live")
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"resenas_negativas"},(p)=>{
      if(p.new.local_id===cfg.local_id && !negativas.find(x=>x.id===p.new.id)){
        negativas.unshift(p.new); renderNeg(); renderMetrics(); renderProblemas(); beep();
        try{ if("Notification" in window && Notification.permission==="granted") new Notification("Nueva reseña negativa 🧡",{ body:(p.new.comentario||"").slice(0,120), tag:"kuyen-neg" }); }catch(e){}
      }
    })
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"envios"},(p)=>{
      if(p.new.local_id===cfg.local_id && !historial.find(x=>x.id===p.new.id)){ historial.unshift(p.new); renderHist(); renderMetrics(); }
    })
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"valoraciones"},(p)=>{
      if(p.new.local_id===cfg.local_id){ valoraciones.unshift(p.new); renderMetrics(); renderPositivas(); }
    })
    .subscribe((status)=>{ setLive(status==="SUBSCRIBED"); });
}

boot();
</script>
