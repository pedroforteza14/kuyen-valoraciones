<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Kuyen · Valorá tu experiencia</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍩</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap" id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const C = window.KUYEN;
const sb = (C.SUPABASE_URL && C.SUPABASE_ANON_KEY) ? supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY) : null;
const $=(h)=>{const t=document.createElement("template");t.innerHTML=h.trim();return t.content.firstElementChild;};
const app=document.getElementById("app");

const _params = new URLSearchParams(location.search);
const localSlug = _params.get("local") || "agronomia";
const envioId = _params.get("e") || null; // etiqueta del envío (para saber quién valoró)
let googleUrl = C.GOOGLE_REVIEW_URL; // se sobreescribe con el local de la base
let localId = null;
if(sb){ sb.from("locales").select("id,google_review_url").eq("slug",localSlug).single().then(({data})=>{ if(data){ localId=data.id; if(data.google_review_url) googleUrl=data.google_review_url; } }); }
// Agrupa los toques de esta persona: si cambia de estrellas, el panel cuenta solo la última.
const uuid=()=>crypto.randomUUID?crypto.randomUUID():"10000000-1000-4000-8000-100000000000".replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16));
const visita=uuid();
async function getLocalId(){
  if(!localId && sb){ const { data } = await sb.from("locales").select("id").eq("slug",localSlug).single(); if(data) localId=data.id; }
  return localId;
}
// Guarda cada estrella que toca (1 a 5), y con fueAGoogle=true cuando toca el botón de Google.
async function logRating(n, fueAGoogle=false){
  if(!sb || !(await getLocalId())) return;
  const row={ estrellas:n, local_id:localId, envio_id:envioId, visita, fue_a_google:fueAGoogle };
  const { error } = await sb.from("valoraciones").insert(row);
  if(error && envioId){ await sb.from("valoraciones").insert({ ...row, envio_id:null }); } // por si el envío se borró del historial
}
function openGoogle(){ window.open(googleUrl,"_blank","noopener"); logRating(picked,true); }

const LEAF=`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 4C10 4 4 10 4 20c0 0 6-1 10-5 3-3 5-7 6-11ZM7 17c1-4 4-7 8-9"/></svg>`;
const starSVG=`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17.9 6.1 20.3l1.3-6.5L2.5 9.3l6.6-.8L12 2.5Z"/></svg>`;
const gLogo=`<svg viewBox="0 0 24 24" fill="none"><path fill="#4285F4" d="M23 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.2c-.3 1.4-1.1 2.6-2.3 3.4v2.8h3.7C21.7 18.6 23 15.8 23 12.3Z"/><path fill="#34A853" d="M12 24c3.1 0 5.7-1 7.6-2.8l-3.7-2.8c-1 .7-2.3 1.1-3.9 1.1-3 0-5.5-2-6.4-4.7H1.8v2.9C3.7 21.5 7.5 24 12 24Z"/><path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.4-.4-2.1s.1-1.4.4-2.1V7.7H1.8C1 9.2.6 10.6.6 12.7s.4 3.5 1.2 5l3.8-2.9Z"/><path fill="#EA4335" d="M12 5.4c1.7 0 3.2.6 4.4 1.7l3.3-3.3C17.7 1.8 15.1.7 12 .7 7.5.7 3.7 3.2 1.8 6.9l3.8 2.9C6.5 7.4 9 5.4 12 5.4Z"/></svg>`;

app.appendChild($(`<div class="brand"><img class="logo" src="img/logo.png" alt="Kuyén · churros & chipa"></div>`));

const card=$(`<div class="card center fade">
  <h2>¿Cómo estuvo tu experiencia?</h2>
  <p class="lead">Tu opinión nos ayuda a mejorar. Tocá las estrellas 👇</p>
  <div class="stars" id="stars"></div>
  <p class="hint" id="hint">Elegí de 1 a 5 estrellas</p>
  <div id="result"></div>
</div>`);
app.appendChild(card);
app.appendChild($(`<p class="foot">Kuyén · churros &amp; chipa 🧡</p>`));

const labels=["","Muy mala","Mala","Regular","Buena","¡Excelente!"];
const starsEl=card.querySelector("#stars"), hintEl=card.querySelector("#hint"), resultEl=card.querySelector("#result");
let picked=0;
for(let i=1;i<=5;i++){
  const b=$(`<button class="star" aria-label="${i} estrella${i>1?"s":""}">${starSVG}</button>`);
  b.addEventListener("mouseenter",()=>paint(i));
  b.addEventListener("mouseleave",()=>paint(picked));
  b.addEventListener("click",()=>{picked=i;paint(i);choose(i);});
  starsEl.appendChild(b);
}
function paint(n){[...starsEl.children].forEach((s,idx)=>s.classList.toggle("on",idx<n));hintEl.textContent=n?labels[n]:"Elegí de 1 a 5 estrellas";}
function choose(n){
  logRating(n);
  const draft=(resultEl.querySelector("#cmt")||{}).value||""; // si cambia de estrella, no perder lo que ya escribió
  resultEl.innerHTML="";
  if(n>=4){ resultEl.appendChild(positive(n)); }
  else { resultEl.appendChild(negative(n)); if(draft) resultEl.querySelector("#cmt").value=draft; }
}

function positive(n){
  const w=$(`<div class="fade"><p class="lead" style="margin-top:20px">Mil gracias 🧡<br>Nos ayudás mucho dejando tu valoración en Google:</p></div>`);
  const a=$(`<button class="btn btn-primary btn-big">${gLogo}<span>Dejar mi reseña en Google</span></button>`);
  a.addEventListener("click",openGoogle);
  w.appendChild(a);
  w.appendChild($(`<p class="note">💡 Si Google no te deja publicar, revisá que estés con tu cuenta de Google iniciada. Si no, buscá <b>"${C.BUSINESS_NAME}"</b> en Google Maps y dejá tu reseña ahí 🙏</p>`));
  return w;
}

function negative(n){
  const w=$(`<div class="fade" style="text-align:left">
    <p class="lead" style="margin-top:20px;text-align:center">Gracias por tu sinceridad 🙏<br>Queremos mejorar de verdad. Contanos qué pasó y lo tenemos muy en cuenta 🌿</p>
    <div class="field"><label for="cmt">¿Qué podríamos mejorar?</label><textarea id="cmt" rows="4" placeholder="Ej: el pedido llegó frío / faltó un producto..."></textarea></div>
    <p class="error" id="err"></p>
  </div>`);
  const send=$(`<button class="btn btn-primary">Enviar en privado</button>`);
  send.addEventListener("click",async ()=>{
    const comentario=w.querySelector("#cmt").value.trim();
    const err=w.querySelector("#err");
    if(!comentario){ err.textContent="Contanos brevemente qué pasó 🙏"; return; }
    send.disabled=true; send.textContent="Enviando...";
    if(!sb){ err.textContent="Falta configurar Supabase en config.js"; send.disabled=false; send.textContent="Enviar en privado"; return; }
    await getLocalId();
    let ins = await sb.from("resenas_negativas").insert({ estrellas:n, comentario, local_id:localId, envio_id:envioId, visita });
    if(ins.error){ ins = await sb.from("resenas_negativas").insert({ estrellas:n, comentario, local_id:localId, visita }); } // por si el envío se borró del historial
    if(ins.error){ ins = await sb.from("resenas_negativas").insert({ estrellas:n, comentario, local_id:localId }); } // fallback por si falta la columna visita
    if(ins.error){ err.textContent="No se pudo enviar. Probá de nuevo en un momento."; send.disabled=false; send.textContent="Enviar en privado"; return; }
    w.innerHTML=`<p class="lead fade" style="margin-top:24px;text-align:center">¡Gracias por avisarnos! 🌿<br>Lo vamos a tener muy en cuenta.</p>`;
  });
  w.appendChild(send);
  // Google no permite filtrar quién puede dejar reseña: el link público queda disponible para todos.
  const pub=$(`<p class="note">¿Preferís dejar tu opinión pública? <a href="#" class="glink">Dejala en Google</a></p>`);
  pub.querySelector(".glink").addEventListener("click",e=>{ e.preventDefault(); openGoogle(); });
  w.appendChild(pub);
  return w;
}
</script>
</body>
</html>
